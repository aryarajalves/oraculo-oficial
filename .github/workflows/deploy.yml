name: Oráculo — Deploy & Webhooks Multi-Servidor

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Alvo do Deploy (ALL, HAUCAU, OFICIAL, TESTES)'
        required: true
        default: 'ALL'
        type: string

jobs:
  deploy-portainer:
    name: 🚀 Disparo de Webhook Portainer
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🌐 Executar Disparo de Webhook dos Servidores
        env:
          TARGET_SERVER: ${{ github.event.inputs.target }}
          WEBHOOK_HAUCAU: ${{ secrets.WEBHOOK_HAUCAU }}
          WEBHOOK_OFICIAL: ${{ secrets.WEBHOOK_OFICIAL }}
          WEBHOOK_TESTES: ${{ secrets.WEBHOOK_TESTES }}
        run: node scripts/trigger_webhooks.mjs
