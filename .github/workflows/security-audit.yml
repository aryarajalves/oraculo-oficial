name: Security Audit & Vulnerability Scanner

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Executa varredura semanal aos domingos à meia-noite
    - cron: '0 0 * * 0'

jobs:
  security-audit:
    name: Audit Dependencies (Frontend, Node Backend, Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run Unified Security Audit
        run: node scripts/security_audit.mjs --pre-push
