name: Oráculo CI/CD — Quality, Tests & Docker Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: 🧪 Code Quality, Unit Tests & Security
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🐍 Configurar Python (v3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Instalar Dependências do Node.js
        run: |
          npm install
          npm --prefix frontend install
          npm --prefix backend install

      - name: 🐍 Instalar Dependências do Python & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: 🚀 Executar Suíte Unificada de Testes e Limites
        run: npm run test:all

  docker-build:
    name: 🐳 Build & Push Docker Image
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Build & Push — Oráculo (App Unificada)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oraculo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/oraculo:${{ github.sha }}

      - name: 📦 Build & Push — Oráculo Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/worker.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oraculo-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/oraculo-worker:${{ github.sha }}
