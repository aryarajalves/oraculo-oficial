name: Oráculo CI/CD — Quality, Tests & Docker Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: 🧪 Code Quality, Unit Tests & Security
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🐍 Configurar Python (v3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar Dependências do Node.js
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm --prefix frontend install --no-audit --no-fund --legacy-peer-deps
          npm --prefix backend install --no-audit --no-fund --legacy-peer-deps

      - name: 🐍 Instalar Dependências do Python & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: 🚀 Executar Suíte Unificada de Testes e Limites
        run: npm run test:all

  docker-build:
    name: 🐳 Build, Push & Auto-Deploy Portainer
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🏷️ Extrair Versão do package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Build & Push — Oráculo (App Oficial)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oraculo:${{ steps.pkg_version.outputs.version }}

      - name: 🚀 Acionar Webhooks do Portainer (Auto-Deploy)
        env:
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          node -e "
            const secrets = JSON.parse(process.env.ALL_SECRETS_JSON || '{}');
            const webhookKeys = Object.keys(secrets).filter(k => k.startsWith('WEBHOOK_'));
            const { execSync } = require('child_process');

            if (webhookKeys.length === 0) {
              console.log('ℹ️ Nenhum secret com prefixo WEBHOOK_ cadastrado.');
              process.exit(0);
            }

            console.log('🚀 Disparando atualização automática para ' + webhookKeys.length + ' servidor(es)...\n');

            for (const key of webhookKeys) {
              const serverName = key.replace('WEBHOOK_', '');
              const url = secrets[key];
              if (!url || !url.startsWith('http')) continue;

              console.log('📡 Notificando Portainer de [ ' + serverName + ' ]...');
              try {
                const cmd = 'curl -s -o /dev/null -w \"%{http_code}\" -X POST \"' + url + '\"';
                const statusCode = execSync(cmd).toString().trim();
                console.log('✅ [ ' + serverName + ' ] Resposta do Portainer: HTTP ' + statusCode);
              } catch (err) {
                console.error('⚠️ Falha ao acionar ' + serverName + ':', err.message);
              }
            }
          "
