server {
    listen 5889;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha requisições de páginas HTML principais e rota raiz para o Express
    # para garantir que as validações de sessão e redirecionamentos funcionem.


    # Encaminha endpoints de autenticação
    location /auth/ {
        proxy_pass http://backend:3131;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Encaminha endpoints da API
    location /api/ {
        proxy_pass http://backend:3131;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte para Server-Sent Events (SSE) do /api/events e operações longas de IA
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Servir arquivos estáticos (CSS, JS, Imagens, etc.) diretamente pelo Nginx
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets com hash podem ter cache seguro
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
